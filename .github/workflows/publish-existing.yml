name: Publish verified rc-1.3.3 HAP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Download verified HAP artifact
        uses: actions/download-artifact@v4
        with:
          name: VintagePomeloPro-arm64-v8a-unsigned-fdf65c2194370005e42449d9f4f0358bb9d3f02e
          path: release-assets
          repository: guodong168888-sudo/VintagePomeloPro
          run-id: 33470104597
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and rename artifact
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          data=json.load(open('release-assets/ci-source.json', encoding='utf-8'))
          assert data['commit'] == 'fdf65c2194370005e42449d9f4f0358bb9d3f02e', data
          assert data['releaseTag'] == 'rc-1.3.3', data
          PY
          mapfile -t haps < <(find release-assets -type f -name '*.hap')
          test "${#haps[@]}" -eq 1
          mv "${haps[0]}" release-assets/VintagePomeloPro-rc-1.3.3-arm64-v8a-unsigned.hap
          sha256sum release-assets/VintagePomeloPro-rc-1.3.3-arm64-v8a-unsigned.hap

      - name: Upload HAP to existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rc-1.3.3
          name: VintagePomeloPro rc-1.3.3 Romantic Escapades
          body: |
            Pura X Max / HarmonyOS 7 compatibility build for Romantic Escapades.
            Built and verified from commit fdf65c2194370005e42449d9f4f0358bb9d3f02e.
            Unsigned HAP for sideload signing workflows.
          files: release-assets/VintagePomeloPro-rc-1.3.3-arm64-v8a-unsigned.hap
          make_latest: true
          fail_on_unmatched_files: true
